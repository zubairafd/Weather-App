<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta
      name="description"
      content="SkyCast - Modern glassmorphic PWA weather web app with real-time forecasts, air quality index, live precipitation radar, and severe weather alerts."
    />
    <meta property="og:title" content="SkyCast - Weather Forecast & Live Radar" />
    <meta
      property="og:description"
      content="Real-time glassmorphic weather application with 7-day forecast, air quality, live radar map, and severe alerts."
    />
    <meta property="og:image" content="%BASE_URL%favicon.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SkyCast - Modern Weather & Live Radar</title>
    <!-- SPA redirect script for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-slate-950 text-white selection:bg-yellow-400 selection:text-slate-950">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: #facc15; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <p style="margin-top: 16px; font-size: 14px; color: #94a3b8; font-weight: 500;">Loading SkyCast...</p>
        <style>
          @keyframes spin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <noscript>
      <div style="padding: 20px; text-align: center; color: white; background: #020617; font-family: system-ui, sans-serif;">
        JavaScript is required to run SkyCast Weather App. Please enable JavaScript in your browser settings.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
